name: Force Apply SUSFS Patch (4.19)

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source
        uses: actions/checkout@v4

      - name: 📦 Install Tools
        run: |
          sudo apt update
          sudo apt install -y patch

      - name: 📂 Download Patch
        run: |
          wget -O susfs_patch_to_4.19.patch https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Patch/susfs_patch_to_4.19.patch

      - name: 🩹 FORCE Apply Patch (ignore errors)
        run: |
          patch -p1 < susfs_patch_to_4.19.patch || true

      - name: 📂 Show Reject Files
        run: |
          echo "=== REJECT FILES ==="
          find . -name "*.rej" || true

      - name: 📤 Commit Result
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Force apply SUSFS patch (manual fix required)" || echo "Nothing to commit"
          git push
