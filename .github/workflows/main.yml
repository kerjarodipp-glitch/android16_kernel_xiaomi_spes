name: Apply SUSFS Patch (4.19)

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clone Kernel Source
        uses: actions/checkout@v4

      - name: 📦 Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y patch

      - name: 📂 Download SUSFS Patch
        run: |
          wget -O susfs_patch_to_4.19.patch https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Patch/susfs_patch_to_4.19.patch

      - name: 🧪 Check Patch (Dry Run)
        run: |
          patch -p1 --dry-run < susfs_patch_to_4.19.patch

      - name: 🩹 Apply Patch
        run: |
          patch -p1 < susfs_patch_to_4.19.patch

      - name: 📤 Commit Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Apply SUSFS patch for 4.19" || echo "No changes to commit"
          git push
